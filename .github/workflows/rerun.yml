name: "Rerun failed build jobs"

# Auto-retry for the flaky Build matrix (QEMU/TCG wedges, OCR misreads,
# mirror hiccups): when a Build run completes with a failure, rerun ONLY its
# failed jobs, up to 3 total attempts (run_attempt < 3 = at most 2 retries).
# workflow_run fires only for the workflow named "Build" on the DEFAULT
# branch, and only after that run has fully completed -- the API rejects
# rerunning an in-progress run, which is why this cannot be a trailing job
# inside build.yml itself. A rerun keeps the original event context, so a
# release-tag run that gets retried still uploads its release assets.
#
# NOTE (base-builder): like readme.yml, this file is copied as-is into every
# <os>-builder by generate.yml (Step 2). In base-builder itself there is no
# "Build" workflow, so it never fires here.

permissions:
  actions: write

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  rerun:
    # Only genuine failures. A cancelled run (e.g. superseded through the
    # Build concurrency group by a newer push) must stay dead, and success
    # obviously needs no retry.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }}) failed; rerunning its failed jobs"
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
